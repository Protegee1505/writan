[workspace]
resolver = "3"
members = [
    "crates/writan-core",
    "crates/writan-crypto",
    "crates/writan-sync",
    "crates/writan-server",
    "app/src-tauri",
    "app-linux",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
authors = ["Protegee1505 <118532261+Protegee1505@users.noreply.github.com>"]
repository = "https://github.com/Protegee1505/writan"

[workspace.dependencies]
# internal crates
writan-core = { path = "crates/writan-core" }
writan-crypto = { path = "crates/writan-crypto" }
writan-sync = { path = "crates/writan-sync" }

# external
argon2 = "0.6"
axum = "0.8"
base64 = "0.22"
blake3 = "1.8"
chacha20poly1305 = "0.11"
diffy = "0.5"
# The gtk-rs crates are renamed to their in-code names here (the crates'
# library names are `gtk4` / `libadwaita`; ecosystem code says `gtk::`/`adw::`).
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7" }
sourceview5 = "0.9"
pulldown-cmark = "0.13"
notify = "8.2"
rand = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Maintained YAML (de)serializer (saphyr lineage) — replaces serde_yaml_ng,
# which pulls the archived unsafe-libyaml.
serde-saphyr = { version = "2.0.0", default-features = false, features = ["serialize", "deserialize"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1.28", features = ["serde", "v4"] }
zeroize = "1.9"

# Release builds prioritise size and speed (moved here from the Tauri
# template's member manifest, where Cargo would ignore it).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
