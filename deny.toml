[advisories]
version = 2
# The entries below are unmaintained-crate flags (no known exploit) with no
# fixed release available — everything else must stay clean. The fixable
# `time` / `quick-xml` DoS advisories were resolved by raising MSRV to 1.90
# and updating (see docs/PROGRESS.md, "CI & builds").
ignore = [
    # glib-macros 0.18 <- glib 0.18 (Tauri's Linux GTK3 chain)
    "RUSTSEC-2024-0370",
    # urlpattern 0.3 <- unic-* 0.9 (tauri-utils)
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    # zbus 5.x family (zvariant, zvariant_derive, zbus_names) <-
    # tauri-plugin-opener's D-Bus chain: deprecated crates merged into zbus 6,
    # no fixed 5.x release (flagged 2026-10-17).
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # Mozilla CA-bundle data via `webpki-roots` (ureq/rustls TLS) — data, not
    # code.
    "CDLA-Permissive-2.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
