# Downloadable builds: run this from the Actions tab ("Run workflow") or push
# a v* tag. All artifacts stay downloadable for 90 days (Actions run page, or
# `gh run download -R Protegee1505/writan`).
#
# - windows: Writan .msi + NSIS setup + portable writan-app.exe
# - linux:   release GTK shell binary + headless spike measurement
#            (WRITAN_MEASURE prints cold start + idle RSS under xvfb)
# - linux-bundles: .deb, .rpm and .AppImage of the Tauri app (unsigned), built
#            on 22.04 so they need glibc 2.35 (Debian 12, Fedora 36, Ubuntu
#            22.04) instead of the 2.39 of an ubuntu-latest build
# - server:  the writan-server sync binary + scripts/server-install.sh, built
#            on 22.04 for the same glibc floor
# - android: debug APK for arm64 (M5). The Android project is committed under
#            app/src-tauri/gen/android; the job installs JDK 17 + NDK
#            r27.3.13750724 and builds with `tauri android build`.
# - release: only on a v* tag — attaches every artifact plus SHA256SUMS.txt to
#            the GitHub release of that tag (manual runs skip it)
#
# `scripts/android-setup.sh` reproduces the local/Cloud Shell toolchain
# (JDK 17 + SDK + NDK) that `android init` needed.
name: artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-bundle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix app
      - name: Build installers
        run: npm --prefix app run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: writan-windows-x64
          if-no-files-found: error
          path: |
            target/release/writan-app.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  linux:
    name: Linux binary + spike measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system dependencies (GTK shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-bundle
      - name: Build release binary
        run: cargo build --release -p writan-linux
      - name: Headless spike measurement (software rendering)
        run: |
          xvfb-run -a env GSK_RENDERER=cairo WRITAN_MEASURE=1 ./target/release/writan | tee measure.txt
      - name: Show measurements
        run: grep -E "writan-measure" measure.txt
      - uses: actions/upload-artifact@v4
        with:
          name: writan-linux-x64
          if-no-files-found: error
          path: |
            target/release/writan
            measure.txt

  linux-bundles:
    name: Linux .deb / .rpm / AppImage
    # 22.04 on purpose: a bundle built on ubuntu-latest carries that runner's
    # glibc floor (2.39, Fedora 40+); 22.04 asks for 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system dependencies (Tauri + bundlers)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev rpm
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-tauri-bundle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix app
      - name: Build bundles
        run: npm --prefix app run tauri build
      - name: List bundles
        run: find target/release/bundle -maxdepth 2 -type f -printf '%p %s bytes\n'
      - uses: actions/upload-artifact@v4
        with:
          name: writan-linux-bundles
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  server:
    name: Sync server binary
    # 22.04 on purpose: the same glibc 2.35 floor as the app bundles, so the
    # binary runs on Debian 12 / Ubuntu 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-binary
      - name: Build the server
        run: cargo build --release -p writan-server
      - name: Smoke test
        run: ./target/release/writan-server --version
      - name: Stage the assets
        run: |
          mkdir -p dist
          install -m 755 target/release/writan-server dist/writan-server
          install -m 755 scripts/server-install.sh dist/writan-server-install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: writan-server-linux-x64
          if-no-files-found: error
          path: dist/

  android:
    name: Android debug APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-debug
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix app
      - name: Install Android packages
        # setup-android@v4 (v4.0.2 fixed the removed `tools` package) puts
        # sdkmanager on PATH; the packages below are what the committed
        # gen/android project asks for.
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.3.13750724"
      - name: Build the debug APK
        run: |
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          npm --prefix app run tauri -- android build --debug --apk --target aarch64
      - name: List the APKs
        run: find app/src-tauri/gen/android/app/build/outputs/apk -type f -printf '%p %s bytes\n'
      - uses: actions/upload-artifact@v4
        with:
          name: writan-android-arm64
          if-no-files-found: error
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    name: Attach the installers to the GitHub release
    # Runs only for a v* tag; a manual dispatch (branch ref) skips it, so
    # artifacts still work without publishing anything.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, linux-bundles, server, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Checksums
        run: |
          find dist -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh cannot read the repository from a
          # git remote; point it at the workflow's own repository.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Writan $GITHUB_REF_NAME" --generate-notes
          find dist -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
