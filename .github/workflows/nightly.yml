name: nightly

on:
  schedule:
    # 03:17 UTC daily — off the top of the hour to avoid the busy window.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  simulator:
    name: N-device sync simulator (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: N-device sync simulator (release)
        run: cargo test -p writan-sync --release --test simulator -- --ignored --nocapture three_devices_converge_through_a_shared_folder

  s3-simulator:
    name: S3 simulator (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # MinIO withdrew its public images and binaries (the Docker Hub repo is
      # gone, quay.io refuses anonymous pulls, dl.min.io returns 410), so the
      # bucket simulator runs against adobe/s3mock — a small, actively
      # maintained S3 test server. Its initial-buckets setting creates the
      # bucket, so no CLI step is needed.
      - name: Start S3Mock
        run: |
          docker run -d --name s3mock -p 9090:9090 \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=writan-sim \
            adobe/s3mock:latest
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:9090/; then exit 0; fi
            sleep 1
          done
          echo "S3Mock did not become healthy" >&2
          docker logs s3mock
          exit 1
      - name: S3 simulator (release)
        env:
          WRITAN_S3_ENDPOINT: http://127.0.0.1:9090
          WRITAN_S3_REGION: us-east-1
          WRITAN_S3_BUCKET: writan-sim
          WRITAN_S3_ACCESS_KEY: writan
          WRITAN_S3_SECRET_KEY: writan-secret
        run: cargo test -p writan-sync --release --test simulator -- --ignored --nocapture three_devices_converge_through_a_bucket
