# Screenshot the real app from CI, so an agent (or a human without the right
# machine) can look at the UI instead of guessing: tools/visual/README.md.
#
# Manual trigger, not on every push — the Windows debug build takes a few
# minutes, and the phone job only needs the mock frontend. All jobs upload
# PNGs (+ a DOM text dump on Windows):
#   gh workflow run visual.yml -R Protegee1505/writan
#   gh run download <run-id> -n writan-windows-shots
name: visual

on:
  workflow_dispatch:
    inputs:
      actions:
        description: Action script under tools/visual/actions/
        default: tauri.actions

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  phone-ui:
    name: Phone shell screenshots (mock backend, 390x844)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            tools/visual/package-lock.json
      - name: Frontend + driver dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix tools/visual
      - name: Headless browser
        run: npx --prefix tools/visual playwright install --with-deps chromium-headless-shell
      - name: Phone walkthrough (one pane, drawer, Android first run)
        run: >
          scripts/mock-shot.sh --serve --size 390x844
          --actions tools/visual/actions/mobile.actions --strict --out shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writan-phone-shots
          path: shots
          if-no-files-found: error

  linux-ui:
    name: Linux GTK shell screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: visual-linux
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            xvfb xdotool imagemagick fonts-dejavu-core fonts-noto-cjk
      - name: Build the GTK shell
        run: cargo build --release -p writan-linux
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Driver dependencies
        run: npm ci --prefix tools/visual
      - name: Screenshot walkthrough (Xvfb)
        run: scripts/gui-shot.sh --bin target/release/writan --out shots --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writan-linux-shots
          path: shots
          if-no-files-found: error

  windows-ui:
    name: Windows app screenshots (WebView2 over CDP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: visual-windows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            tools/visual/package-lock.json
      - name: Frontend dependencies
        run: npm ci --prefix app
      - name: Driver dependencies
        run: npm ci --prefix tools/visual
      - name: Build (debug, frontend embedded, CDP enabled)
        shell: pwsh
        run: |
          # WebView2 ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS as soon as wry
          # sets the property through the API (wry always does), so the debugging
          # port has to come from the window config — patched here, never in the
          # repo: shipped builds must not open a port.
          $path = 'app/src-tauri/tauri.conf.json'
          $browserArgs = '--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9222 --remote-allow-origins=*'
          $cfg = Get-Content $path -Raw | ConvertFrom-Json
          $cfg.app.windows[0] | Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue $browserArgs -Force
          $cfg | ConvertTo-Json -Depth 32 | Set-Content -Encoding utf8 $path
          # tauri/build.rs: `let dev = !custom_protocol` — without this feature the
          # binary loads devUrl (localhost:1420) instead of the built frontend.
          npm --prefix app run build
          cargo build -p writan-app --features tauri/custom-protocol
      - name: Seed the fixture vault into the app config
        shell: pwsh
        run: |
          $vault = Join-Path $env:RUNNER_TEMP 'visual-vault'
          Copy-Item -Recurse -Force tools\visual\fixtures\vault $vault
          $appData = Join-Path $env:APPDATA 'com.writan.desktop'
          New-Item -ItemType Directory -Force $appData | Out-Null
          @{ vault_path = $vault } | ConvertTo-Json -Compress |
            Set-Content -Encoding utf8 (Join-Path $appData 'config.json')
          echo "vault: $vault"
      - name: Probe the app (launch, watch, screenshot)
        shell: pwsh
        run: pwsh -NoProfile -File tools/visual/windows-probe.ps1 -OutDir shots -Seconds 90
      - name: Drive the walkthrough
        if: env.CDP_UP == '1'
        shell: pwsh
        run: >
          node tools/visual/drive.mjs --backend cdp --cdp http://127.0.0.1:9222
          --out shots --actions "tools/visual/actions/${{ inputs.actions }}"
          --ready-text Welcome --strict
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writan-windows-shots
          path: shots
          if-no-files-found: warn
      - name: Verdict
        shell: pwsh
        run: |
          if ($env:CDP_UP -ne '1') { throw 'CDP never came up — see shots\windows-probe.txt in the artifact' }
