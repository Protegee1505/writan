# Screenshot the real app from CI, so an agent (or a human without the right
# machine) can look at the UI instead of guessing: tools/visual/README.md.
#
# Manual trigger, not on every push — the Windows debug build takes a few
# minutes. Both jobs upload PNGs (+ a DOM text dump on Windows):
#   gh workflow run visual.yml -R Protegee1505/writan
#   gh run download <run-id> -n writan-windows-shots
name: visual

on:
  workflow_dispatch:
    inputs:
      actions:
        description: Action script under tools/visual/actions/
        default: tauri.actions

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-ui:
    name: Linux GTK shell screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: visual-linux
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            xvfb xdotool imagemagick fonts-dejavu-core fonts-noto-cjk
      - name: Build the GTK shell
        run: cargo build --release -p writan-linux
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Driver dependencies
        run: npm ci --prefix tools/visual
      - name: Screenshot walkthrough (Xvfb)
        run: scripts/gui-shot.sh --bin target/release/writan --out shots --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writan-linux-shots
          path: shots
          if-no-files-found: error

  windows-ui:
    name: Windows app screenshots (WebView2 over CDP)
    runs-on: windows-latest
    env:
      # WebView2 hands these to its Chromium; the driver then connects over CDP
      # and screenshots render inside the renderer, so no visible session is
      # needed on the runner.
      WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9222 --remote-allow-origins=*
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: visual-windows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            tools/visual/package-lock.json
      - name: Frontend dependencies
        run: npm ci --prefix app
      - name: Driver dependencies
        run: npm ci --prefix tools/visual
      - name: Build (debug, frontend embedded)
        shell: pwsh
        run: |
          npm --prefix app run build
          cargo build -p writan-app
      - name: Seed the fixture vault into the app config
        shell: pwsh
        run: |
          $vault = Join-Path $env:RUNNER_TEMP 'visual-vault'
          Copy-Item -Recurse -Force tools\visual\fixtures\vault $vault
          $appData = Join-Path $env:APPDATA 'com.writan.desktop'
          New-Item -ItemType Directory -Force $appData | Out-Null
          @{ vault_path = $vault } | ConvertTo-Json -Compress |
            Set-Content -Encoding utf8 (Join-Path $appData 'config.json')
          echo "vault: $vault"
      - name: Launch the app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $exe = Resolve-Path 'target/debug/writan-app.exe'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru `
            -RedirectStandardOutput shots\app-stdout.txt -RedirectStandardError shots\app-stderr.txt
          $p.Id | Set-Content shots\app-pid.txt
          "launched writan-app pid $($p.Id)"
      - name: Wait for the WebView2 CDP endpoint
        shell: pwsh
        run: |
          $up = $false
          $deadline = (Get-Date).AddMinutes(2)
          while ((Get-Date) -lt $deadline) {
            try { $v = Invoke-RestMethod 'http://127.0.0.1:9222/json/version' -TimeoutSec 5; $up = $true; break }
            catch { Start-Sleep 3 }
          }
          "CDP_UP=$(if ($up) { '1' } else { '0' })" | Add-Content $env:GITHUB_ENV
          "cdp endpoint up: $up"
      - name: Diagnostics when CDP is down
        if: env.CDP_UP != '1'
        shell: pwsh
        run: |
          $diag = 'shots\diagnostics.txt'
          "== session ==" | Set-Content $diag
          "SESSIONNAME=$env:SESSIONNAME  interactive_user=$(whoami)" | Add-Content $diag
          (qwinsta 2>&1 | Out-String) | Add-Content $diag
          "== processes ==" | Add-Content $diag
          (Get-Process | Where-Object { $_.ProcessName -match 'writan|msedge|WebView' } |
            Select-Object Name, Id, MainWindowTitle, @{n='Sec';e={[int]((Get-Date) - $_.StartTime).TotalSeconds}} |
            Format-Table -AutoSize | Out-String) | Add-Content $diag
          "== port 9222 ==" | Add-Content $diag
          ((netstat -ano | Select-String ':9222' | Out-String)) | Add-Content $diag
          "== webview2 runtime ==" | Add-Content $diag
          foreach ($k in 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                          'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}') {
            if (Test-Path $k) { "evergreen pv=$((Get-ItemProperty $k).pv)  ($k)" | Add-Content $diag }
            else { "absent: $k" | Add-Content $diag }
          }
          (Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | Out-String) | Add-Content $diag
          "== app output ==" | Add-Content $diag
          foreach ($f in 'shots\app-stdout.txt', 'shots\app-stderr.txt') {
            "--- $f" | Add-Content $diag
            if (Test-Path $f) { (Get-Content $f -Tail 40 | Out-String) | Add-Content $diag }
          }
          Get-Content $diag
      - name: Desktop screenshot (no CDP needed)
        if: env.CDP_UP != '1'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
          $g = [Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\shots\desktop.png")
          "saved shots/desktop.png ($($b.Width)x$($b.Height))"
      - name: Drive the walkthrough
        if: env.CDP_UP == '1'
        shell: pwsh
        run: >
          node tools/visual/drive.mjs --backend cdp --cdp http://127.0.0.1:9222
          --out shots --actions "tools/visual/actions/${{ inputs.actions }}"
          --ready-text Welcome --strict
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writan-windows-shots
          path: shots
          if-no-files-found: warn
      - name: Verdict
        shell: pwsh
        run: |
          if ($env:CDP_UP -ne '1') { throw 'CDP never came up — see shots\diagnostics.txt in the artifact' }
