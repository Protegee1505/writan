[package]
name = "writan-sync"
description = "Writan sync primitives: version vectors, merge logic, storage targets"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
diffy = { workspace = true }
hmac = { workspace = true }
quick-xml = { workspace = true }
qrcode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["parsing"] }
ureq = { workspace = true }
uuid = { workspace = true }
writan-core = { workspace = true }
writan-crypto = { workspace = true }
zeroize = { workspace = true }

# Desktop keychains: keyring 3's native stores (ADR-0005 §10).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { workspace = true }

# Android: the app's own Keystore-backed store (ADR-0010 §4–5). keyring 3 has
# no Android store, so `keychain.rs` aliases `keyring_core` as `keyring` there.
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
keyring-core = "1"

[dev-dependencies]
tempfile = "3"
# The live-server round trip (tests/server_sync.rs) spawns the real binary.
writan-server = { workspace = true }
