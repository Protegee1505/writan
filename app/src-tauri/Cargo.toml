[package]
name = "writan-app"
description = "Writan desktop and mobile application (Tauri shell)"
version = "0.2.0"
authors = ["Protegee1505 <118532261+Protegee1505@users.noreply.github.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "writan_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
writan-core = { path = "../../crates/writan-core" }
writan-crypto = { path = "../../crates/writan-crypto" }
writan-sync = { path = "../../crates/writan-sync" }

# The JNI shim that hands the Android app context to `ndk-context` (ADR-0010
# §5), so the Keystore-backed keyring store can be created from Rust.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
